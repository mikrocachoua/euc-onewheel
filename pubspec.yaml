name: euc_onewheel
description: "EUC OneWheel — app para rodar en monociclo eléctrico: panel de conducción, grabación de rodadas con GPS, mapa, historial y telemetría Bluetooth multimarca."
publish_to: 'none'
version: 2.0.0+10

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  share_plus: ^12.0.1
  flutter_blue_plus: ^2.3.14
  permission_handler: ^13.0.2
  package_info_plus: ^9.0.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
